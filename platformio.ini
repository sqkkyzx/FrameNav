[platformio]
default_envs = xiao-c6-debug
extra_configs =
  platformio.secrets.ini

[secrets]
; Optional overrides in platformio.secrets.ini. A clean clone needs no secrets.
build_flags =

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv

[common]
build_flags =
  -D ALPHALOC_WIFI_WEB=1
  -D ALPHALOC_BLE_CONFIG=0
  -D ALPHALOC_BLE_LOCATION=0
  -D ALPHALOC_NEOPIXEL_PIN=6
  ${secrets.build_flags}
debug_build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ALPHALOC_VERBOSE=1
  - DALPHALOC_LOG_NMEA=0
  ; -D ALPHALOC_FACTORY_RESET=1
c6_build_flags =
  -D GPS_UART_TX_PIN=5
  -D GPS_UART_RX_PIN=4
s3_build_flags =
  -D GPS_UART_TX_PIN=39
  -D GPS_UART_RX_PIN=38
  -D ALPHALOC_BATTERY_MONITOR=1
  -D ALPHALOC_BATTERY_SDA_PIN=3
  -D ALPHALOC_BATTERY_SCL_PIN=4
  -D ALPHALOC_BATTERY_I2C_POWER_PIN=7

[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
  -D RELEASE
  ${common.build_flags}
  ${common.c6_build_flags}
  -D LOG_LOCAL_LEVEL=ESP_LOG_NONE

[env:esp32c6-debug]
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_type = debug
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  ${common.build_flags}
  ${common.c6_build_flags}
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_LOG_NMEA=0
  -D ALPHALOC_FAKE_GPS=1

[env:esp32c6-debug-gps]
board = esp32-c6-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_type = debug
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  ${common.build_flags}
  ${common.c6_build_flags}
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_LOG_NMEA=0

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags =
  -D RELEASE
  -D LOG_LOCAL_LEVEL=ESP_LOG_NONE
  ${common.build_flags}
  ${common.s3_build_flags}

[env:esp32s3-debug]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_type = debug
build_flags =
  -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
  ${common.build_flags}
  ${common.s3_build_flags}
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_LOG_NMEA=0
  -D ALPHALOC_FAKE_GPS=1

[env:esp32s3-debug-gps]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_type = debug
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  ${common.build_flags}
  ${common.s3_build_flags}
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_LOG_NMEA=0

; Phase 1 only: bare XIAO + USB, no GNSS or other external peripherals.
; Deliberately do not inherit the upstream common/board/secrets flags.
[env:xiao-c6-debug]
platform = espressif32 @ 6.13.0
board = seeed_xiao_esp32c6
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.xiao-c6.defaults"
build_type = debug
upload_speed = 460800
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_FAKE_GPS=1
  -D ALPHALOC_LOG_NMEA=0
  -D ALPHALOC_WIFI_WEB=0
  -D ALPHALOC_BLE_CONFIG=0
  -D ALPHALOC_BLE_LOCATION=0
  -D ALPHALOC_BATTERY_MONITOR=0
  -D ALPHALOC_LIGHT_SLEEP=0
  -D ALPHALOC_BOARD_XIAO_ESP32C6=1
  -D ALPHALOC_PHASE1=1
  -D ALPHALOC_FAKE_GPS_STEPPING=1
  -D ALPHALOC_FAKE_GPS_USB_TIME=1
  -D ALPHALOC_LOCATION_OBSERVER=1

; Phase 2: K18 UART NMEA. Keep the verified Fake GPS target for rollback.
; Override the complete flag list so no simulated position/USB time survives.
[env:xiao-c6-gnss-debug]
extends = env:xiao-c6-debug
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ALPHALOC_VERBOSE=1
  -D ALPHALOC_FAKE_GPS=0
  -D ALPHALOC_FAKE_GPS_STEPPING=0
  -D ALPHALOC_FAKE_GPS_USB_TIME=0
  -D ALPHALOC_LOG_NMEA=1
  -D ALPHALOC_WIFI_WEB=0
  -D ALPHALOC_BLE_CONFIG=0
  -D ALPHALOC_BATTERY_MONITOR=0
  -D ALPHALOC_LIGHT_SLEEP=0
  -D ALPHALOC_BOARD_XIAO_ESP32C6=1
  -D ALPHALOC_PHASE1=0
  -D ALPHALOC_PHASE2=1
  -D ALPHALOC_LOCATION_OBSERVER=1
  -D GPS_UART_TX_PIN=16
  -D GPS_UART_RX_PIN=17
  -D GPS_UART_BAUD=115200

; v15: FrameNav Web power profiles and immediately applied custom policies.
; Keep xiao-c6-gnss-debug (v8.1) as the rollback / verbose diagnostic build.
[env:xiao-c6-gnss-power]
extends = env:xiao-c6-debug
build_type = release
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.xiao-c6.defaults;sdkconfig.xiao-c6-power.defaults"
build_flags =
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D ALPHALOC_VERBOSE=0
  -D ALPHALOC_FAKE_GPS=0
  -D ALPHALOC_FAKE_GPS_STEPPING=0
  -D ALPHALOC_FAKE_GPS_USB_TIME=0
  -D ALPHALOC_LOG_NMEA=0
  -D ALPHALOC_WIFI_WEB=1
  -D ALPHALOC_USB_HOST_WIFI=1
  -D ALPHALOC_BLE_CONFIG=0
  -D ALPHALOC_BLE_LOCATION=1
  -D ALPHALOC_BATTERY_MONITOR=0
  -D ALPHALOC_LIGHT_SLEEP=0
  -D ALPHALOC_BOARD_XIAO_ESP32C6=1
  -D ALPHALOC_PHASE1=0
  -D ALPHALOC_PHASE2=1
  -D ALPHALOC_LOCATION_OBSERVER=1
  -D ALPHALOC_POWER_SAVE=1
  -D ALPHALOC_GNSS_RATE_1HZ=1
  -D ALPHALOC_GNSS_STANDBY=0
  -D ALPHALOC_TRACK_STORE=1
  -D GPS_UART_TX_PIN=19
  -D GPS_UART_RX_PIN=17
  -D GPS_UART_BAUD=115200

; Temporary, isolated power-source experiment. It records one 20-second
; read-only USB PHY/SOF/BLE signature per boot and leaves production policy
; unchanged.
[env:xiao-c6-power-source-test]
extends = env:xiao-c6-gnss-power
build_flags =
  ${env:xiao-c6-gnss-power.build_flags}
  -D ALPHALOC_POWER_SOURCE_PROBE=1
